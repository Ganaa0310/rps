<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock , paper ,siccors</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url("https://as1.ftcdn.net/jpg/01/15/57/50/1000_F_115575013_bGdWptTXmcWnYIYT3W9JyDWi4mTQHyGj.jpg");
            background-size: cover;
        }
        .game{
            width: 450px;
            padding: 20px;
            background-color: transparent;
            backdrop-filter: blur(7px);
            border-radius: 15px;
            border: 5px solid black;
        }
        .game img{
            width: 147px;
            height: 147px;
            object-fit: cover;
            
        }
        .reset{
            background-color: blue;
            border:1px solid black ;
            border-radius: 7px;
            color: white;
            padding: 10px;
            margin-left:184px ;
        }
    </style>
</head>
<body>
    <div class="game">
        <p class="cPoint">
            Computer Point:0
        </p>
        <p class="pPoint">Player Point:0</p>
        <img src="rock.png" alt="" onclick="play('rock')">
        <img src="paper.png" alt="" onclick="play('paper')">
        <img src="siccors.png" alt="" onclick="play('siccors')">
        <p class="pChoice">Player Choice:</p>
        <p class="cChoice">Computer Choice:</p>
        <p class="winner">Winner:</p>
        <button class="reset" onclick="reset()">Restart</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
